<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
  <title>Pin Code</title>
</head>

<body>
  <div id="root">
    <div class="result-block">
      <h4>Result:</h4>
      <button class="result-block__btn">Reset</button>
    </div>
    <ul class="keyboard">
      <li class="keyboard__row">
        <button class="keyboard__cell">1</button>
        <button class="keyboard__cell">2</button>
        <button class="keyboard__cell">3</button>
      </li>
      <li class="keyboard__row">
        <button class="keyboard__cell">4</button>
        <button class="keyboard__cell">5</button>
        <button class="keyboard__cell">6</button>
      </li>
      <li class="keyboard__row">
        <button class="keyboard__cell">7</button>
        <button class="keyboard__cell">8</button>
        <button class="keyboard__cell">9</button>
      </li>
      <li class="keyboard__row keyboard__row--zero">
        <button class="keyboard__cell">0</button>
      </li>
    </ul>
  </div>
</body>

</html>
